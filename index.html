<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>코엑스 실내 길라잡이 AI - AMD 행사장 데모</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- 상단 헤더 및 페르소나 스위처 -->
    <header class="app-header">
      <div class="title-group">
        <span class="badge-live">IMDF LIVE DEMO</span>
        <h1>실내 길라잡이 AI</h1>
        <p class="subtitle">코엑스 → 웨스틴 파르나스</p>
      </div>
      <div class="persona-switch" aria-label="안내 시나리오 선택">
        <button id="btn-mak" class="persona-btn active" onclick="setPersona('mak')">막해일 시나리오</button>
        <button id="btn-gil" class="persona-btn" onclick="setPersona('gil')">길라임 시나리오</button>
      </div>
    </header>

    <!-- 실시간 3D 방향 HUD 카드 -->
    <section id="hud-panel" class="hud-panel safe_guide">
      <div class="hud-top">
        <span id="hud-level" class="hud-tag">B1 · 코엑스</span>
        <span id="hud-status" class="hud-status-badge">안내 중</span>
      </div>

      <div class="hud-main">
        <div class="compass-box">
          <div id="arrow-indicator" class="arrow-indicator">▲</div>
          <span id="yaw-text" class="yaw-text">28° · 직진</span>
        </div>
        <div class="location-info">
          <div class="four-word-box" id="four-word-address">///지하삼성.광장개방.우상에스컬.직진</div>
          <h2 id="current-node-name">밀레니엄 광장 입구</h2>
          <p id="trap-warning" class="trap-text">⚠️ 파르나스몰 오진입 주의</p>
        </div>
      </div>
    </section>

    <section class="route-preview">
      <div class="route-header">
        <span>🧭 경로 미리보기</span>
        <span id="route-step-label">삼성역 → 별마당 → 아쿠아 → 웨스틴</span>
      </div>
      <div class="mini-map" id="mini-map">
        <div class="track-line"></div>
        <div class="map-node active" data-node="opn-sam-01"><span>삼성역</span></div>
        <div class="map-node" data-node="opn-central-starfield"><span>별마당</span></div>
        <div class="map-node" data-node="unt-aquarium-entrance"><span>아쿠아</span></div>
        <div class="map-node" data-node="opn-westin-lobby"><span>웨스틴</span></div>
      </div>
    </section>

    <!-- 대화형 길찾기 채팅 영역 -->
    <main id="chat-box" class="chat-box"></main>

    <!-- 데모 시연용 빠른 발화 칩 -->
    <section class="quick-prompts">
      <p class="quick-label">🎬 사용자 시나리오 비교 테스트:</p>
      <div class="chip-container">
        <button class="chip" onclick="sendPreset('삼성역에서 들어왔는데 길 잃었어. 행사장 길 찾아줘')">길라임 직행</button>
        <button class="chip warning" onclick="sendPreset('파르나스 타워 쪽으로 와버렸어')">막해일 오진입</button>
        <button class="chip" onclick="sendPreset('별마당 도서관 앞이야')">별마당 기준점</button>
        <button class="chip" onclick="sendPreset('아쿠아 입구까지 왔는데 어디로 가야 하지')">재진입 안내</button>
        <button class="chip success" onclick="sendPreset('파르나스 로비 앞까지 왔어')">목적지 복귀</button>
      </div>
    </section>

    <!-- 사용자 직접 입력창 -->
    <footer class="chat-input-area">
      <div class="input-wrap">
        <input type="text" id="user-input" placeholder="현재 보이는 간판이나 위치를 입력하세요..." onkeypress="handleKeyPress(event)" />
        <span id="input-status" class="input-status neutral">대기</span>
      </div>
      <button id="submit-button" onclick="handleUserSubmit()">전송</button>
    </footer>
    <div class="session-reset-wrap">
      <button class="reset-button" onclick="resetSession()">새 세션 시작</button>
    </div>

    <section class="analytics-panel">
      <div class="analytics-header">📊 경로 분석 요약</div>
      <div class="analytics-grid">
        <div class="metric-card">
          <span class="metric-label">이탈 감지</span>
          <strong id="metric-offroute">0</strong>
        </div>
        <div class="metric-card">
          <span class="metric-label">도착 성공</span>
          <strong id="metric-arrival">0</strong>
        </div>
        <div class="metric-card">
          <span class="metric-label">긴급 재탐색</span>
          <strong id="metric-reroute">0</strong>
        </div>
      </div>
      <div id="analytics-log" class="analytics-log">분석 로그가 아직 없습니다.</div>
    </section>

    <!-- IMDF JSON 출력 인스펙터 (토글) -->
    <details class="json-inspector">
      <summary>🔍 실시간 AI 응답 & Apple IMDF JSON 데이터 보기</summary>
      <pre id="json-output">{}</pre>
    </details>
  </div>

  <script src="app.js"></script>
</body>
</html>
